<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SP — KOutNet</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script>
    (function () {
      try {
        var d = document.documentElement;
        function crumb(name) {
          var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
          return m ? m[1] : '';
        }
        var shared = null, n = parseInt(crumb('koutnet_look_n'), 10) || 0;
        if (n > 0 && n <= 3) {
          var enc = '';
          for (var j = 0; j < n; j++) enc += crumb('koutnet_look_' + j);
          if (enc) { try { shared = JSON.parse(decodeURIComponent(enc)); } catch (_) {} }
        }
        var look = {};
        try { look = JSON.parse(localStorage.getItem('koutnet_sp_look') || '{}'); } catch (_) {}
        if (shared && shared.look && typeof shared.look === 'object') {
          for (var sk in shared.look) {
            if (Object.prototype.hasOwnProperty.call(shared.look, sk)) look[sk] = shared.look[sk];
          }
        }
        var colors = look.colors && typeof look.colors === 'object' ? look.colors : {};
        function themeForBg(v) {
          if (typeof v !== 'string') return '';
          var s = v.trim(), c = null;
          var m = /^#?([a-f\d]{3}|[a-f\d]{6})$/i.exec(s);
          if (m) {
            var h = m[1];
            if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
            c = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
          } else {
            var r = /^rgba?\(([^)]+)\)$/i.exec(s);
            if (r) {
              var p = r[1].split(/[\s,/]+/).filter(Boolean).map(Number);
              c = [p[0] || 0, p[1] || 0, p[2] || 0];
            }
          }
          return c ? ((0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45 ? 'dark' : 'light') : '';
        }
        // A saved manual theme can be stale after palette changes; the actual background wins.
        var t = themeForBg(colors.bg);
        if (t !== 'dark' && t !== 'light' && shared) t = shared.theme;
        if (t !== 'dark' && t !== 'light' && shared) t = shared.derivedTheme;
        if (t !== 'dark' && t !== 'light') t = localStorage.getItem('koutnet_sp_theme');
        if (t !== 'dark' && t !== 'light') t = localStorage.getItem('koutnet_sp_look_theme');
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.dataset.theme = t;
        var src = look.wallpaper || (look.wallpaperUrl ? '/api/bg-proxy?url=' + encodeURIComponent(look.wallpaperUrl) : '');
        if (src) {
          d.classList.add('has-wallpaper');
          d.style.setProperty('--sp-bg-image', 'url("' + String(src).replace(/"/g, '%22') + '")');
        }
        ['bg', 'fg', 'card', 'border', 'muted', 'accent', 'accent-fg'].forEach(function (k) {
          if (typeof colors[k] === 'string') d.style.setProperty('--' + k, colors[k]);
        });
      } catch (_) { /* браузер запретил localStorage */ }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=comments39">
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><a href="/" id="brandLink" title="SP"><img src="/brand.webp" alt="SP"><img src="/brand2.webp" alt="KOutNet"></a></div>
    <nav>
      <a href="/" data-tab="feed">Лента</a>
      <a href="/profile" data-tab="profile">Профиль</a>
      <a href="https://koutnet.pw/" data-external>главная</a>
      <a href="https://tasks.koutnet.pw/" data-external>задачи</a>
    </nav>
    <div class="controls" id="userBox"></div>
  </header>

  <main>
    <section id="loginBox" class="panel hidden">
      <h1>Щитпосты</h1>
      <p class="muted">Вход через аккаунт Tasks - аккаунт и активность общие.</p>
      <a class="btn-primary button-link" id="loginLink" href="#">Войти через Tasks</a>
      <p class="muted small">Нет аккаунта? <a href="https://koutnet.pw/koutnet-registration.html">Зарегистрироваться</a></p>
    </section>

    <div class="layout" id="layout">
      <section class="col-main" id="feedPane">
        <form id="composer" class="panel">
          <label class="field">
            <span>Новый пост <span class="muted small">до 500 символов</span></span>
            <textarea id="postText" maxlength="500" rows="3" placeholder="представь что ты безумный ученый и напиши свой пост"></textarea>
          </label>
          <div class="md-toolbar" aria-label="Форматирование">
            <button type="button" data-md="bold" title="Жирный: **текст**">жирный</button>
            <button type="button" data-md="italic" title="Курсив: *текст*">курсив</button>
            <button type="button" data-md="code" title="Код: `текст` или блок кода">код</button>
            <button type="button" data-md="link" title="Ссылка: [текст](https://...)">ссылка</button>
            <button type="button" data-md="quote" title="Цитата: > текст">цитата</button>
            <button type="button" data-md="list" title="Список: - пункт">список</button>
            <span class="muted small">посты поддерживают markdown!</span>
          </div>
          <div class="composer-row">
            <label class="button-link file-label">
              <span id="fileLabel">Прикрепить картинку</span>
              <input type="file" id="postImage" accept="image/*" hidden>
            </label>
            <button type="button" id="clearImage" class="hidden">Убрать картинку</button>
            <span class="counter muted small" id="counter">0 / 500</span>
            <button type="submit" id="postSubmit" class="btn-primary" disabled>Опубликовать</button>
            <a class="md-help" href="/markdown-help-me.html">справка о KON markdown</a>
          </div>
          <img id="imagePreview" class="preview hidden" alt="Предпросмотр">
        </form>
        <div id="posts" class="feed"><p class="empty">Загрузка ленты…</p></div>
      </section>

      <section class="col-profile hidden" id="profilePane">
        <div id="profile"><p class="empty">Загрузка профиля…</p></div>
      </section>
    </div>
  </main>

  <div id="appearance" class="appearance hidden" role="dialog" aria-label="оформление">
    <div class="appearance-box panel">
      <button type="button" id="appearanceClose" class="appearance-close" title="Закрыть">×</button>
      <h2>оформление</h2>

      <label class="field">
        <span>свои обои (файл)</span>
        <input type="file" id="wallpaperFile" accept="image/*">
      </label>
      <div class="wallpaper-preview" id="wallpaperPreview"></div>
      <div class="appearance-row">
        <button type="button" id="wallpaperRemove">убрать обои</button>
      </div>

      <label class="field">
        <span>или url фона</span>
        <input type="url" id="wallpaperUrl" placeholder="https://...">
      </label>
      <div class="appearance-row">
        <button type="button" id="wallpaperUrlApply">применить url</button>
      </div>

      <label class="check"><input type="checkbox" id="autoColors" checked> подстраивать цвета под фон</label>

      <div class="color-grid">
        <label>фон <input type="color" data-color="bg"></label>
        <label>текст <input type="color" data-color="fg"></label>
        <label>карточки <input type="color" data-color="card"></label>
        <label>граница <input type="color" data-color="border"></label>
        <label>акцент <input type="color" data-color="accent"></label>
        <label>текст на акценте <input type="color" data-color="accent-fg"></label>
      </div>

      <div class="appearance-row">
        <button type="button" id="appearanceReset">сбросить</button>
      </div>
      <p class="muted small" id="appearanceHint">всё хранится только в этом браузере</p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/vendor/markdown-it.min.js"></script>
  <script src="/vendor/markdown-it-task-lists.min.js"></script>
  <script src="/vendor/markdown-it-footnote.min.js"></script>
  <script src="/vendor/markdown-it-emoji.min.js"></script>
  <script src="/vendor/markdown-it-anchor.umd.js"></script>
  <script src="/vendor/markdown-it-container.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/icons.js?v=comments39"></script>
  <script src="/app.js?v=comments39"></script>
</body>
</html>
