<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в SP — KOutNet Tasks</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fff; color: #1f2328; display: grid; place-items: center; min-height: 100vh; }
    html[data-theme="dark"] body { background: #0d1117; color: #e6edf3; }
    .box { border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; padding: 22px 26px; max-width: 420px; }
    html[data-theme="dark"] .box { border-color: #30363d; background: #161b22; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #656d76; }
    html[data-theme="dark"] p { color: #8d96a0; }
    a { color: #0969da; }
    html[data-theme="dark"] a { color: #4493f8; }
    button { border: 1px solid #d0d7de; background: #f6f8fa; color: inherit; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Вход в щитпосты</h1>
    <p id="status">Проверяем аккаунт Tasks…</p>
    <button id="login" class="hidden">Войти в Tasks</button>
  </div>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const login = document.getElementById('login');
      if (localStorage.getItem('koutnet_sp_theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      const back = new URLSearchParams(location.search).get('back') || 'https://sp.koutnet.pw/';
      const token = localStorage.getItem('koutnet_token');
      if (!token) {
        status.textContent = 'Сначала войдите в Tasks, затем вернитесь сюда.';
        login.textContent = 'Открыть Tasks';
        login.onclick = () => { location.href = 'https://tasks.koutnet.pw/login'; };
        login.classList.remove('hidden');
        return;
      }
      try {
        const me = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
        if (!me.ok) throw new Error('Сессия Tasks истекла');
        const r = await fetch('/api/auth/sp-code', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
        if (!r.ok) throw new Error('Не удалось получить код');
        const data = await r.json();
        location.href = back + (back.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(data.code);
      } catch (e) {
        status.textContent = e.message + '. Войдите в Tasks заново.';
        login.textContent = 'Открыть Tasks';
        login.onclick = () => { location.href = 'https://tasks.koutnet.pw/login'; };
        login.classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
